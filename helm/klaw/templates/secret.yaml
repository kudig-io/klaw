{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "klaw.secretName" . }}
  labels:
    {{- include "klaw.labels" . | nindent 4 }}
type: Opaque
stringData:
  KLAW_API_TOKEN: {{ .Values.secrets.apiToken | quote }}
  {{- /* AI 诊断助手：deployment.yaml 的 envFrom 会全量注入，空值被代码视为未配置 */}}
  KUDIG_AI_API_KEY: {{ .Values.secrets.ai.apiKey | quote }}
  KUDIG_AI_PROVIDER: {{ .Values.secrets.ai.provider | quote }}
  KUDIG_AI_BASE_URL: {{ .Values.secrets.ai.baseUrl | quote }}
  KUDIG_AI_MODEL: {{ .Values.secrets.ai.model | quote }}
  KLAW_DINGTALK_APP_KEY: {{ .Values.secrets.dingtalk.appKey | quote }}
  KLAW_DINGTALK_APP_SECRET: {{ .Values.secrets.dingtalk.appSecret | quote }}
  KLAW_DINGTALK_WEBHOOK: {{ .Values.secrets.dingtalk.webhook | quote }}
  KLAW_DINGTALK_SECRET: {{ .Values.secrets.dingtalk.secret | quote }}
  KLAW_FEISHU_APP_ID: {{ .Values.secrets.feishu.appId | quote }}
  KLAW_FEISHU_APP_SECRET: {{ .Values.secrets.feishu.appSecret | quote }}
{{- end }}
