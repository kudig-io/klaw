# Klaw 配置文件

kubernetes:
  clusters:
    - name: kind-my-k8s
      kubeconfig: /Users/allengaller/.kube/config
      context: kind-my-k8s

messaging:
  dingtalk:
    enabled: false
    app_key: your_app_key
    app_secret: your_app_secret
    webhook: your_webhook_url
    secret: your_secret
    webhook_port: 8081  # 接收钉钉消息的端口
  feishu:
    enabled: false
    app_id: your_app_id
    app_secret: your_app_secret

# 事件监听配置（Watch 模式 - 实时推送）
events:
  enabled: true
  watch_types:          # 监听的资源类型
    - Pod
    - Deployment
    - Service
    - Node
  namespaces: []        # 监听的命名空间，为空表示所有
  event_types:          # 监听的事件类型
    - Warning
    - Error
  reasons:              # 关注的原因（为空表示所有）
    - BackOff
    - Unhealthy
    - Failed
    - Killing
  exclude_reasons:      # 排除的原因
    - Scheduled
    - SuccessfulMountVolume
    - Pulling
    - Pulled
    - Created
    - Started
  min_severity: warning # 最小严重级别: info, warning, critical
  rate_limit: 10        # 每秒最大事件数
  dedup_window: 300     # 去重窗口（秒）
  mute_duration: 5      # 相同事件静音时长（分钟）
  channels: []          # 推送的频道列表（为空则发送到所有平台）

openclaw:
  enabled: true
  skills: ./skills

server:
  port: 8080
  auth:
    enabled: false   # 本地开发默认关闭；生产环境请启用并配置 KLAW_API_TOKEN
    token: ""
  cors:
    allowed_origins: []   # 跨域白名单；留空表示仅允许同源

# SOS 语音应急快速对话（默认关闭；启用需配置 DashScope workspace_id 与 api_key）
