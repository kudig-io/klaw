# Kind 集群配置
# 用于 Klaw 本地开发和测试

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: klaw-test

# 节点配置
nodes:
  # 控制平面节点
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # 端口映射（可选，用于本地访问）
    extraPortMappings:
      - containerPort: 80
        hostPort: 8081
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
    # 挂载本地目录用于持久化数据
    extraMounts:
      - hostPath: /Users/allengaller/Documents/GitHub/kudig-io/klaw/deployment/kind/data
        containerPath: /data

  # 工作节点 1
  - role: worker
    extraMounts:
      - hostPath: /Users/allengaller/Documents/GitHub/kudig-io/klaw/deployment/kind/data
        containerPath: /data

  # 工作节点 2（可选，用于测试多节点场景）
  - role: worker
    extraMounts:
      - hostPath: /Users/allengaller/Documents/GitHub/kudig-io/klaw/deployment/kind/data
        containerPath: /data

# 网络配置
networking:
  # 禁用默认 CNI，使用 Calico 或其他（可选）
  # disableDefaultCNI: true
  
  # 使用固定子网
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"

# 特性开关
featureGates: {}

# 容器运行时配置
# 注意：containerd 2.x（kindest/node v1.31+）已弃用 io.containerd.grpc.v1.cri 插件名，
# 沿用旧写法会导致 CRI 插件加载失败、kubelet 无法启动。
# 如需本地 registry，请改用 config_path 方式并确认 containerd 版本。
# containerdConfigPatches:
#   - |-
#     [plugins."io.containerd.cri.v1.images".registry]
#       config_path = "/etc/containerd/certs.d"
