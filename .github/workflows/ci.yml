name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download deps
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -count=1 -cover

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || true

  operator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build operator
        run: go build ./...
      - name: Test operator
        run: go test ./... -count=1

  etcd-backup-module:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/etcd-backup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build module
        run: go build ./...
      - name: Test module
        run: go test ./... -count=1

  etcd-guardian-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build operator module
        working-directory: modules/etcd-guardian
        run: go build ./...
      - name: Test operator module
        working-directory: modules/etcd-guardian
        run: go test ./... -count=1
      - name: Build backend module
        working-directory: modules/etcd-guardian/backend
        run: go build ./...
      - name: Test backend module
        working-directory: modules/etcd-guardian/backend
        run: go test ./... -count=1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm run test:run

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: |
          helm lint helm/klaw
          helm lint modules/etcd-guardian/charts/etcdguardian
      - name: Helm template render check
        run: |
          helm template klaw helm/klaw > /dev/null
          helm template etcdguardian modules/etcd-guardian/charts/etcdguardian > /dev/null

  docker:
    runs-on: ubuntu-latest
    needs: [go, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: klaw:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
